name: Setup Bun
description: Install Bun for the job. Defaults to the latest stable release; pass a version to test the minimum.
inputs:
  version:
    required: false
    default: latest
    description: Bun version or "latest"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.version }}
