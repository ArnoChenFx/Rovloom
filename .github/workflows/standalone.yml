# 本机编译和执行单文件设施探针；只有已接入真实入口时才上传 CLI 预览候选，不发布 Release。
name: Standalone candidates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64
          - os: windows-2025
            target: bun-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Bun on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .bun-version)" = 1.4.3
          mkdir "$RUNNER_TEMP/standalone-bun"
          curl -fLsS --retry 2 https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64.zip -o "$RUNNER_TEMP/standalone-bun/bun.zip"
          echo "3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18  $RUNNER_TEMP/standalone-bun/bun.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/standalone-bun/bun.zip" -d "$RUNNER_TEMP/standalone-bun"
          echo "$RUNNER_TEMP/standalone-bun/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Install pinned Bun on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content .bun-version).Trim() -ne '1.4.3') { throw 'Bun pin mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'standalone-bun'
          New-Item -ItemType Directory $destination | Out-Null
          $archive = Join-Path $destination 'bun.zip'
          Invoke-WebRequest https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-windows-x64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0bf84e808552beea67bf1202a287a35c6c825d837b287b3f8e9dd513dba35d3d') { throw 'Bun archive checksum mismatch' }
          Expand-Archive $archive $destination
          (Join-Path $destination 'bun-windows-x64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Frozen install
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Compile and run isolated packaging probe, including omitted-Worker rejection
        run: bun --no-env-file test ./test/release/executable.test.mjs
      - name: Verify actual Windows PE icon and console subsystem
        if: runner.os == 'Windows'
        run: python scripts/release/verify-windows-icon.py dist/release/bun-windows-x64/probe/packaging-probe.exe
      - name: Build and smoke the existing product CLI when present
        id: product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -f src/cli/main.ts && -f src/native-contract/compiler-worker.ts ]]; then
            bun --no-env-file run release:build
            extension=''
            if [[ "$RUNNER_OS" == Windows ]]; then extension='.exe'; fi
            bun --no-env-file run release:smoke "$PWD/dist/release/$TARGET/candidate/rovloom$extension"
            if [[ "$RUNNER_OS" == Windows ]]; then
              python scripts/release/verify-windows-icon.py "dist/release/$TARGET/candidate/rovloom.exe"
            fi
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'CLI product wiring pending; only the packaging probe was accepted.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload packaging probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaging-probe-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/release/${{ matrix.target }}/probe/packaging-probe*
            dist/release/${{ matrix.target }}/probe/manifest.json
            dist/release/${{ matrix.target }}/probe/rovloom.ico
      - name: Compile and execute the real schema Worker when present
        id: native
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f src/native-contract/compiler-worker.ts ]]; then
            bun --no-env-file scripts/release/native-smoke.mjs
            if [[ "$RUNNER_OS" == Windows ]]; then
              python scripts/release/verify-windows-icon.py dist/release/bun-windows-x64/probe/packaging-probe.exe
            fi
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Schema Worker factory pending; no schema runtime acceptance is claimed.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload real schema factory probe when accepted
        if: steps.native.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-contract-probe-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/release/${{ matrix.target }}/probe/packaging-probe*
            dist/release/${{ matrix.target }}/probe/manifest.json
      - name: Upload CLI preview candidate
        if: steps.product.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-preview-candidate-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/release/${{ matrix.target }}/candidate/rovloom*
            dist/release/${{ matrix.target }}/candidate/manifest.json
