# 只收集事实：在真实 Windows runner 上确认官方 Herdr 的命名管道名与 HERDR_SOCKET_PATH 行为，
# 用来决定 Connector 的 Windows 实现（#173）；不是验收门禁，也不进发布流程。
name: Windows probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/windows/**
      - .github/workflows/windows-probe.yml
permissions:
  contents: read
jobs:
  herdr:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Download official Herdr (Windows x86_64)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'herdr'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-windows-x86_64.zip' -OutFile "$dir\herdr.zip"
          Expand-Archive -Path "$dir\herdr.zip" -DestinationPath $dir -Force
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          "HERDR_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Probe pipe name, HERDR_SOCKET_PATH and process facts
        shell: pwsh
        run: bun --no-env-file scripts/windows/herdr-probe.mjs "$env:HERDR_DIR"
      - name: Probe AF_UNIX connect (.NET and Bun), peer pid, HERDR_SOCKET_PATH
        shell: pwsh
        run: bun --no-env-file scripts/windows/herdr-probe2.mjs "$env:HERDR_DIR"
      - name: Probe Win32 facts via bun:ffi (pipe server pid, image path, owner SID)
        shell: pwsh
        run: bun --no-env-file scripts/windows/herdr-probe3.mjs "$env:HERDR_DIR"
      - name: Frozen install
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Win32 platform primitives (path trust, pipe server pid, process facts)
        run: bun --no-env-file test ./test/platform/windows.test.ts
      - name: Attach to real official Herdr on Windows (named pipe, pipe server pid, image identity)
        shell: pwsh
        env:
          ROVLOOM_HERDR_WINDOWS: ${{ env.HERDR_DIR }}\herdr.exe
        run: bun --no-env-file test ./test/connector/herdr/attach-windows.test.ts
