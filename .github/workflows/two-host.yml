# 两台“机器”的验收：Gateway 与 Connector 各在独立容器里（文件系统互不可见，只经 Docker 网络上的真实 TCP 通信），
# 在真实 TTY 里按 Quick Start 配对，经官方 MCP SDK 走完整 Herdr 链路，并制造网络断开与恢复。
name: Two-host e2e
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: two-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        run: bun --no-env-file scripts/ci/e2e-plan.mjs two-host
  two-host:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Download official Herdr 0.9.5
        run: |
          curl --fail --location --connect-timeout 15 --max-time 180 --retry 2 -o "$RUNNER_TEMP/herdr" https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $RUNNER_TEMP/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr"
      - name: Build actual standalone product
        run: bun --no-env-file run release:build
      - name: Two containers, real TCP, real TTY pairing
        run: python3 e2e/two_host.py --binary dist/release/bun-linux-x64/candidate/rovloom --herdr "$RUNNER_TEMP/herdr"
  result:
    name: two-host acceptance
    if: always()
    needs: [changes, two-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        continue-on-error: true
      # 分段计时只作观测：continue-on-error 保证它失败时验收结论照常由下一步决定。
      - name: Report job timing segments
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/run.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          bun --no-env-file scripts/ci/job-timing.mjs "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/run.json" | tee "$RUNNER_TEMP/timing.md"
          cat "$RUNNER_TEMP/timing.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Require selected acceptance to succeed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('e2e plan failed')
          selected = results['changes']['outputs'].get('run') == 'true'
          expected = 'success' if selected else 'skipped'
          if any(value['result'] != expected for key, value in results.items() if key != 'changes'):
              raise SystemExit('selected e2e acceptance did not succeed')
          print('e2e acceptance passed' if selected else 'no relevant changes')
          PY
