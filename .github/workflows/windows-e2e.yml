# 真实 Windows runner 上的验收：Win32 原语、附着官方 Herdr / Luvus，以及按 Quick Start 在 ConPTY 里从零配对并经 MCP 走完整链路（含崩溃恢复）。
name: Windows e2e
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: windows-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        run: bun --no-env-file scripts/ci/e2e-plan.mjs windows
  attach:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 10
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Download official Herdr (Windows x86_64)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'herdr'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-windows-x86_64.zip' -OutFile "$dir\herdr.zip"
          Expand-Archive -Path "$dir\herdr.zip" -DestinationPath $dir -Force
          Remove-Item "$dir\herdr.zip"
          "HERDR_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Win32 platform primitives (path trust, pipe server pid, process facts)
        run: bun --no-env-file test ./test/platform/windows.test.ts
      - name: Attach to real official Herdr on Windows (named pipe, pipe server pid, image identity)
        shell: pwsh
        env:
          ROVLOOM_HERDR_WINDOWS: ${{ env.HERDR_DIR }}\herdr.exe
        run: bun --no-env-file test ./test/connector/herdr/attach-windows.test.ts
  quickstart:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 25
    name: quickstart (${{ matrix.scenario }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: first-run
            flags: ''
          - scenario: connector-crash
            flags: --crash
          - scenario: herdr-killed
            flags: --kill-herdr
          - scenario: boot-task-service
            flags: --service
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Download official Herdr (Windows x86_64)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'herdr'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-windows-x86_64.zip' -OutFile "$dir\herdr.zip"
          Expand-Archive -Path "$dir\herdr.zip" -DestinationPath $dir -Force
          Remove-Item "$dir\herdr.zip"
          "HERDR_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build actual standalone product
        run: bun --no-env-file run release:build
      - name: Quick Start on Windows (real ConPTY pairing, attach to real Herdr, MCP chain)
        shell: pwsh
        run: |
          python -m pip install pywinpty
          python e2e\quickstart_windows.py --binary dist\release\bun-windows-x64\candidate\rovloom.exe --herdr-dir $env:HERDR_DIR ${{ matrix.flags }} --then "bun --no-env-file e2e\herdr-session.mjs"
  luvus:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 25
    name: luvus (${{ matrix.scenario }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: first-run
            flags: ''
          - scenario: attach-existing
            flags: --pre-existing
          - scenario: connector-crash
            flags: --crash
          - scenario: luvus-killed
            flags: --pre-existing --kill-luvus
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Download official Luvus (Windows x86_64)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'luvus'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/RizRiyz/luvus/releases/download/v0.14.3/luvus-v0.14.3-x86_64-pc-windows-msvc.zip' -OutFile "$dir\luvus.zip"
          Expand-Archive -Path "$dir\luvus.zip" -DestinationPath $dir -Force
          Remove-Item "$dir\luvus.zip"
          "LUVUS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build actual standalone product
        run: bun --no-env-file run release:build
      - name: Quick Start on Windows with Luvus (real ConPTY pairing, attach to real Luvus, MCP chain)
        shell: pwsh
        env:
          LUVUS_WRITE: '{}'
        run: |
          python -m pip install pywinpty
          python e2e\quickstart_windows.py --binary dist\release\bun-windows-x64\candidate\rovloom.exe --luvus-dir $env:LUVUS_DIR ${{ matrix.flags }} --then "bun --no-env-file e2e\luvus-session.mjs"
  result:
    name: windows acceptance
    if: always()
    needs: [changes, attach, quickstart, luvus]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require selected acceptance to succeed
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('e2e plan failed')
          selected = results['changes']['outputs'].get('run') == 'true'
          expected = 'success' if selected else 'skipped'
          if any(value['result'] != expected for key, value in results.items() if key != 'changes'):
              raise SystemExit('selected e2e acceptance did not succeed')
          print('e2e acceptance passed' if selected else 'no relevant changes')
          PY
