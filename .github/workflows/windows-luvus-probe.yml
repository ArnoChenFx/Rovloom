# 只收集事实：官方 Luvus 在真实 Windows runner 上的行为（#173）；不是验收门禁，随探测结束删除。
name: Windows Luvus probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/windows/luvus-probe.mjs
      - .github/workflows/windows-luvus-probe.yml
permissions:
  contents: read
jobs:
  luvus:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Download official Luvus (Windows x86_64)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'luvus'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/RizRiyz/luvus/releases/download/v0.14.3/luvus-v0.14.3-x86_64-pc-windows-msvc.zip' -OutFile "$dir\luvus.zip"
          Expand-Archive -Path "$dir\luvus.zip" -DestinationPath $dir -Force
          Remove-Item "$dir\luvus.zip"
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          "LUVUS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Probe Luvus on Windows
        shell: pwsh
        run: bun --no-env-file scripts/windows/luvus-probe.mjs "$env:LUVUS_DIR"
