# 真实 macOS runner 上的验收：libSystem 原语，以及后续阶段的 Connector 附着官方 Herdr / Luvus。
name: macOS e2e
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - e2e/**
      - test/platform/**
      - test/connector/**
      - .github/workflows/macos-e2e.yml
permissions:
  contents: read
jobs:
  platform:
    name: platform (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Frozen install
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: macOS platform primitives (peer credentials, process facts)
        run: bun --no-env-file test ./test/platform/macos.test.ts
