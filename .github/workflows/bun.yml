# 在 Linux 上用最低与最新 Bun 运行类型检查、lint、格式、测试与构建。
name: Bun verification
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.3', latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          version: ${{ matrix.bun }}
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run format:check
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file run test
      - run: bun --no-env-file run build
      - run: bun --no-env-file run smoke
