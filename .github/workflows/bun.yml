# 在 Linux 上用最低与最新 Bun 运行类型检查、lint、格式、测试与构建。
name: Bun verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: bun-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.3', latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          version: ${{ matrix.bun }}
      - timeout-minutes: 5
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run format:check
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file run test
      - run: bun --no-env-file run build
      - run: bun --no-env-file run smoke
      - name: Pack the npm tarball and run it from a clean bun add
        run: |
          version="$(bun --no-env-file -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          bun --no-env-file scripts/release/npm-package.mjs "$RUNNER_TEMP/npm-package"
          bun --no-env-file scripts/release/npm-smoke.mjs "$RUNNER_TEMP/npm-package/rovloom-$version.tgz" "$version"
