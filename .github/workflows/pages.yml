# Static marketing site; successful releases refresh metadata from GitHub latest.
name: Project website
on:
  push:
    branches: [main, website]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'test/site/**'
      - 'docs/assets/brand/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'test/site/**'
      - 'docs/assets/brand/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # The publisher uses GITHUB_TOKEN, which does not trigger release.published.
  # workflow_run also deploys from main, matching the Pages environment rules.
  workflow_run:
    workflows: ['Tagged product release']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: project-website-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Successful releases build maintained site code, rather than the release tag.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || '' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Read the latest public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/ci/github-read.mjs "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/site-release.json"
      - name: Check website content and build
        env:
          SITE_RELEASE_FILE: ${{ runner.temp }}/site-release.json
        run: |
          bun --no-env-file test ./test/site
          bun --no-env-file run site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/website' ||
       github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Deploy the tested static artifact
        id: deployment
        uses: actions/deploy-pages@v5
