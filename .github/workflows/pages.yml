# Static marketing site; successful releases refresh metadata from GitHub latest.
name: Project website
on:
  push:
    branches: [main, website]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'test/site/**'
      - 'docs/assets/brand/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'test/site/**'
      - 'docs/assets/brand/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]
  # Releases published with GITHUB_TOKEN do not emit another workflow event.
  workflow_run:
    workflows: ['Tagged product release']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: project-website-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Release events build maintained site code, rather than the release tag.
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'release') && github.event.repository.default_branch || '' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          version: '1.4.3'
      - name: Read the latest public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/site-release.json"
      - name: Check website content and build
        env:
          SITE_RELEASE_FILE: ${{ runner.temp }}/site-release.json
        run: |
          bun --no-env-file test ./test/site
          bun --no-env-file run site:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/site
  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/website' ||
       github.event_name == 'release' || github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Deploy the tested static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
